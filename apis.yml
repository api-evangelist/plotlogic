name: Plotlogic
description: >-
  Plotlogic is a mining technology company that builds AI-driven sensing systems
  for real-time ore and material characterisation. Its flagship product,
  OreSense, scans rock in open-pit, stockpile, and underground mining operations
  and delivers decision-ready quantitative mineralogy in under 15 minutes,
  compared with more than an hour for traditional laboratory assay methods. The
  hardware is engineered for harsh mining environments and integrates into
  existing operational workflows so mines can reduce waste, improve grade
  control, and make faster material-routing decisions. Plotlogic is
  headquartered in Zillmere, Queensland, Australia, and is backed by the
  deep-tech venture firm DCVC. Customer access is delivered through an
  enterprise client platform rather than a public developer API; there is no
  published developer program, SDK, or API documentation at this time.
